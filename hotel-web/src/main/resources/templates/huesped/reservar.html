<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Reservar')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
	<div th:replace="~{fragmentos :: alertas}"></div>
	<h1 class="h3 titulo mb-3">Reservar habitación</h1>
	<div class="card p-3 mb-3">
		<form class="row g-2 align-items-end" method="get" action="/huesped/reservar">
			<div class="col-6 col-md-3"><label class="form-label">Llegada</label>
				<input class="form-control" type="date" name="llegada" th:value="${#strings.isEmpty(b['llegada'])} ? ${hoy} : ${b['llegada']}" th:min="${hoy}" required></div>
			<div class="col-6 col-md-3"><label class="form-label">Salida</label>
				<input class="form-control" type="date" name="salida" th:value="${#strings.isEmpty(b['salida'])} ? ${manana} : ${b['salida']}" required></div>
			<div class="col-8 col-md-3"><label class="form-label">Tipo</label>
				<select class="form-select" name="tipoId"><option value="">Cualquier tipo</option>
					<option th:each="t : ${tipos}" th:value="${t['id']}" th:text="${t['nombre'] + ' (' + t['capacidad'] + ' pers.)'}" th:selected="${t['id'] == b['tipoId']}"></option>
				</select></div>
			<div class="col-4 col-md-3"><button class="btn btn-outline-primary w-100"><i class="bi bi-search"></i> Ver disponibles</button></div>
		</form>
	</div>
	<div class="row g-3" th:if="${libres != null}">
		<div class="col-md-6 col-lg-4" th:each="h : ${libres}">
			<div class="card p-3 h-100">
				<div class="d-flex justify-content-between"><span class="fs-5 titulo" th:text="${h['tipoNombre']}">Doble</span>
					<span class="text-secondary" th:text="'Hab. ' + ${h['numero']}">101</span></div>
				<div class="small text-secondary mb-2" th:text="'Piso ' + ${h['piso']} + ' · hasta ' + ${h['capacidad']} + ' persona(s)'">piso</div>
				<div class="cifra mb-1" th:text="'$' + ${#numbers.formatDecimal(h['valorEstadia'], 1, 'POINT', 0, 'COMMA')}">0</div>
				<div class="small text-secondary mb-3" th:text="'por ' + ${h['noches']} + ' noche(s), antes de IVA'">noches</div>
				<form method="post" action="/huesped/reservar" class="mt-auto">
					<input type="hidden" name="habitacionId" th:value="${h['habitacionId']}">
					<input type="hidden" name="llegada" th:value="${b['llegada']}">
					<input type="hidden" name="salida" th:value="${b['salida']}">
					<button class="btn btn-primary w-100"><i class="bi bi-check2-circle"></i> Reservar esta habitación</button>
				</form>
			</div>
		</div>
		<div class="col-12" th:if="${#lists.isEmpty(libres)}"><div class="card p-4 text-secondary">No hay habitaciones libres para esas fechas. Prueba con otras.</div></div>
	</div>
</main>
<script th:replace="~{fragmentos :: scripts}"></script>
</body>
</html>
