<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Crear cuenta')}"></head>
<body>
<nav class="navbar navbar-dark barra"><div class="container"><a class="navbar-brand fw-semibold" href="/login"><i class="bi bi-building"></i> HotelNova</a></div></nav>
<main class="container py-4" style="max-width: 720px">
	<div th:replace="~{fragmentos :: alertas}"></div>
	<div class="card p-4">
		<h1 class="h4 titulo">Crear mi cuenta de huésped</h1>
		<p class="text-secondary small">Con tu cuenta puedes reservar en línea y ver tus consumos.</p>
		<form method="post" action="/registro" class="row g-3">
			<div class="col-md-4"><label class="form-label">Documento</label>
				<input class="form-control" name="documento" th:value="${form?.get('documento')}" required></div>
			<div class="col-md-4"><label class="form-label">Nombres</label>
				<input class="form-control" name="nombres" th:value="${form?.get('nombres')}" required></div>
			<div class="col-md-4"><label class="form-label">Apellidos</label>
				<input class="form-control" name="apellidos" th:value="${form?.get('apellidos')}" required></div>
			<div class="col-md-4"><label class="form-label">Correo</label>
				<input class="form-control" type="email" name="correo" th:value="${form?.get('correo')}" required></div>
			<div class="col-md-4"><label class="form-label">Teléfono</label>
				<input class="form-control" name="telefono" th:value="${form?.get('telefono')}"></div>
			<div class="col-md-4"><label class="form-label">Nacionalidad</label>
				<input class="form-control" name="nacionalidad" th:value="${form?.get('nacionalidad')}"></div>
			<div class="col-md-4"><label class="form-label">Usuario</label>
				<input class="form-control" name="usuario" th:value="${form?.get('usuario')}" required></div>
			<div class="col-md-4"><label class="form-label">Contraseña</label>
				<input class="form-control" type="password" name="clave" minlength="6" required></div>
			<div class="col-md-4"><label class="form-label">Repetir contraseña</label>
				<input class="form-control" type="password" name="clave2" minlength="6" required></div>
			<div class="col-12 d-flex gap-2">
				<button class="btn btn-primary"><i class="bi bi-person-plus"></i> Crear cuenta</button>
				<a class="btn btn-outline-secondary" href="/login">Ya tengo cuenta</a>
			</div>
		</form>
	</div>
</main>
<script th:replace="~{fragmentos :: scripts}"></script>
</body>
</html>
