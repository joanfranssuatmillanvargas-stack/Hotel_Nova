<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Caja')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
	<div th:replace="~{fragmentos :: alertas}"></div>
	<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
		<div>
			<h1 class="h3 titulo mb-0"><i class="bi bi-cash-coin"></i> Facturas por cobrar</h1>
			<p class="small text-secondary mb-0">Recepción genera la factura en el check-out; aquí se registra el pago.</p>
		</div>
		<a class="btn btn-outline-primary" href="/caja/cierre"><i class="bi bi-calculator"></i> Cierre de caja</a>
	</div>
	<div class="card p-3">
		<div class="table-responsive">
		<table class="table table-sm align-middle mb-0">
			<thead><tr><th>Factura</th><th>Fecha</th><th>Huésped</th><th>Hab.</th><th class="text-end">Total</th><th>Registrar pago</th></tr></thead>
			<tbody>
				<tr th:each="f : ${facturas}">
					<td class="fw-semibold" th:text="'No. ' + ${f['numero']}">No. 12</td>
					<td class="small" th:text="${#strings.substring(#strings.replace(f['fecha'], 'T', ' '), 0, 16)}">2026-11-12 08:00</td>
					<td th:text="${f['huespedDocumento']}">1098</td>
					<td th:text="${f['numeroHabitacion']}">101</td>
					<td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(f['total'], 1, 'POINT', 0, 'COMMA')}">0</td>
					<td>
						<form class="d-flex gap-2" method="post" th:action="@{/caja/facturas/{id}/pago(id=${f['id']})}">
							<select class="form-select form-select-sm" name="medio" style="max-width: 150px">
								<option value="EFECTIVO">Efectivo</option><option value="TARJETA">Tarjeta</option><option value="TRANSFERENCIA">Transferencia</option>
							</select>
							<button class="btn btn-sm btn-success text-nowrap"><i class="bi bi-check2-circle"></i> Cobrar</button>
						</form>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(facturas)}"><td colspan="6" class="text-secondary">No hay facturas pendientes por cobrar.</td></tr>
			</tbody>
		</table>
		</div>
	</div>
</main>
<script th:replace="~{fragmentos :: scripts}"></script>
</body>
</html>
