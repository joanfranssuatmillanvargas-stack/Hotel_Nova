<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Mantenimiento')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-3" style="max-width: 760px">
	<div th:replace="~{fragmentos :: alertas}"></div>
	<h1 class="h4 titulo mb-1">Habitaciones en mantenimiento</h1>
	<p class="small text-secondary">Al registrar la reparación, la habitación pasa a limpieza antes de volver a ofrecerse.</p>

	<div class="card tarjeta-mantenimiento p-3 mb-2" th:each="h : ${habitaciones}">
		<div class="d-flex justify-content-between align-items-start gap-2">
			<div>
				<div class="fs-3 fw-bold titulo lh-1" th:text="${h['numero']}">204</div>
				<div class="small text-secondary" th:text="'Piso ' + ${h['piso']}">Piso</div>
			</div>
			<span class="badge text-bg-danger"><i class="bi bi-tools"></i> Mantenimiento</span>
		</div>
		<div class="mt-2">
			<div class="fw-semibold" th:text="${h['dano'] != null} ? ${h['dano']} : 'Sin daño registrado'">Grifo goteando</div>
			<div class="small text-secondary" th:if="${h['fechaReporte'] != null}">
				Reportado por <span th:text="${h['reportadoPor']}">limpieza</span>
				el <span th:text="${#strings.substring(h['fechaReporte'], 8, 10)} + '/' + ${#strings.substring(h['fechaReporte'], 5, 7)}">05/11</span>
				a las <span th:text="${#strings.substring(h['fechaReporte'], 11, 16)}">08:30</span>
			</div>
		</div>
		<form method="post" th:action="@{/mantenimiento/{id}/reparacion(id=${h['habitacionId']})}" class="row g-2 mt-2">
			<div class="col-12"><input class="form-control" name="descripcion" placeholder="¿Qué se hizo? Ej: se cambió el empaque del grifo" required></div>
			<div class="col-12"><button class="btn btn-success w-100"><i class="bi bi-check2-circle"></i> Registrar reparación</button></div>
		</form>
	</div>
	<div class="card p-4 text-center text-secondary" th:if="${#lists.isEmpty(habitaciones)}">
		<i class="bi bi-emoji-smile fs-2"></i><div>No hay habitaciones en mantenimiento.</div>
	</div>
</main>
<script th:replace="~{fragmentos :: scripts}"></script>
</body>
</html>
