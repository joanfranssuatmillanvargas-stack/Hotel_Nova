spring.application.name=ms-reservas
# Puerto: 8102 en tu PC; en Render se define con la variable PORT
server.port=${PORT:8102}

# ===== MongoDB Atlas (base de datos propia: reservasdb) =====
# La URL con la contraseña NO va en el código (para no subirla a GitHub):
#  - En tu PC se lee del archivo secreto.properties (está en .gitignore)
#  - En Render se lee de la variable de entorno MONGODB_URI
spring.config.import=optional:classpath:secreto.properties
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=reservasdb

# Swagger (OpenAPI): http://localhost:8102/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Muestra el mensaje de los errores (404, 409...) en la respuesta JSON
spring.web.error.include-message=always

# URL de los otros microservicios que consulta por REST (en Render se cambian con variables de entorno)
hotelnova.ms.habitaciones=${HABITACIONES_URL:http://localhost:8101}
hotelnova.ms.huespedes=${HUESPEDES_URL:http://localhost:8103}
hotelnova.ms.servicios=${SERVICIOS_URL:http://localhost:8104}

# Zona horaria del hotel (para saber cuál es "hoy")
hotelnova.zona=America/Bogota
